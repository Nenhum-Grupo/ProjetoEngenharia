name: Weekly Data Ingestion Cron

on:
  schedule:
    # Roda todo domingo às 06:00 UTC (3h no horário de Brasília)
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  run-weekly-cron:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código Python (branch s3repo)
        uses: actions/checkout@v4
        with:
          ref: s3repo  # Baixa os scripts refatorados da branch s3repo

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Weekly Cron Job
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_STORAGE_TOKEN }}
          GITHUB_REPO: ${{ secrets.GH_STORAGE_REPO }}
          GITHUB_BRANCH: "main" # Branch do repositório de DADOS destino
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
        run: |
          python -m app.jobs.weekly_cron