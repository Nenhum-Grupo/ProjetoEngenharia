name: Weekly Data Ingestion Cron

on:
  schedule:
    # Roda todo domingo às 06:00 UTC (3h no horário de Brasília)
    - cron: '0 6 * * 0'
  workflow_dispatch:

# Configura o diretório padrão onde os comandos 'run' serão executados
defaults:
  run:
    working-directory: backend/ai-python

jobs:
  run-weekly-cron:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          ref: main # Baixa o código da branch s3repo

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          # Aponta a localização do requirements.txt para o cache do pip funcionar corretamente
          cache-dependency-path: backend/ai-python/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Weekly Cron Job
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          API_TWITTER: ${{ secrets.API_TWITTER }}
          TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
          REPO_GITHUB: ${{ secrets.REPO_GITHUB }}
          GITHUB_BRANCH: "main"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          BUCKETNAME: ${{ secrets.BUCKETNAME }}
        run: |
          python -m app.jobs.weekly_cron
